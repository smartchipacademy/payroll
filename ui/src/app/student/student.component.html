<button mat-raised-button color="default"  (click)="openPopUp()">STUDENT FORM</button>

<div class="button-container">
    <button (click)="logout()" style="color: primary">Logout</button>
    </div>


<div style="padding: 5%;margin: auto;">
    <p style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold;">STUDENTS DATA</p>
    

    <mat-table [dataSource]="students" class="mat-elevation-z8">
        <ng-container matColumnDef="score1">
            <th mat-header-cell *matHeaderCellDef> Course </th>
            <td mat-cell *matCellDef="let user"> {{user.course}} </td>
        </ng-container>
        <ng-container matColumnDef="score2">
            <th mat-header-cell *matHeaderCellDef> DateOfBirth </th>
            <td mat-cell *matCellDef="let user"> {{user.dateOfBirth}} </td>
        </ng-container>

        <ng-container matColumnDef="score3">
            <th mat-header-cell *matHeaderCellDef> PhoneNumber </th>
            <td mat-cell *matCellDef="let user"> {{user.phoneNumber}} </td>
        </ng-container>

        <ng-container matColumnDef="score4">
            <th mat-header-cell *matHeaderCellDef> CourseFee </th>
            <td mat-cell *matCellDef="let user"> {{user.courseFee}} </td>
        </ng-container>

        <ng-container matColumnDef="score5">
            <th mat-header-cell *matHeaderCellDef> Address </th>
            <td mat-cell *matCellDef="let user"> {{user.address}} </td>
        </ng-container>

        
        <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
        <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
    </mat-table>
    </div>
